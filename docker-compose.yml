# The whole system on a laptop (Step 0.1). Start: cp .env.example .env && docker compose up -d --wait
# Ports: auth 3001, platform 3002, docbeam-api 3003, ws-local 3004, Postgres 5432, LocalStack 4566, ClamAV 3310.
name: docbeam

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-aws-env: &aws-env
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_ENDPOINT_URL: http://localstack:4566

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_APP_PASSWORD: ${AUTH_APP_PASSWORD}
      PLATFORM_APP_PASSWORD: ${PLATFORM_APP_PASSWORD}
      DOCBEAM_APP_PASSWORD: ${DOCBEAM_APP_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - ./docker/db-bootstrap:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docbeam_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    # 4.14 is the last LocalStack image that runs without an auth token (G20, D-M0-5).
    image: localstack/localstack:4.14
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ${AWS_REGION}
    ports: ["4566:4566"]
    volumes:
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/docbeam-ready && curl -sf localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  clamav:
    image: clamav/clamav:1.4
    environment:
      # Scan limits raised to a little above the 1 GiB file limit (D-M2-12). A file or archive over a
      # limit is reported as found, never as clean.
      CLAMD_CONF_StreamMaxLength: 1100M
      CLAMD_CONF_MaxFileSize: 1100M
      CLAMD_CONF_MaxScanSize: 1100M
      CLAMD_CONF_AlertExceedsMax: "yes"
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  auth:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: auth }
    # exec: node becomes PID 1 and gets SIGTERM, so a stop drains in-flight requests (D-M2-17).
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/server.js"]
    environment:
      PORT: 3001
      DATABASE_URL: postgres://auth_app:${AUTH_APP_PASSWORD}@postgres:5432/auth_db
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      JWT_ISSUER: ${JWT_ISSUER}
      JWKS_URL: http://auth:3001/.well-known/jwks.json
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      CLIENT_SECRET_DELIVERY_WORKER: ${CLIENT_SECRET_DELIVERY_WORKER}
      CLIENT_SECRET_DOCBEAM_API: ${CLIENT_SECRET_DOCBEAM_API}
      CLIENT_SECRET_WS_HANDLERS: ${CLIENT_SECRET_WS_HANDLERS}
      CLIENT_SECRET_SEED_SCRIPT: ${CLIENT_SECRET_SEED_SCRIPT}
    ports: ["3001:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  platform:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: platform }
    # exec: node becomes PID 1 and gets SIGTERM, so a stop drains in-flight requests (D-M2-17).
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/server.js"]
    environment:
      PORT: 3002
      DATABASE_URL: postgres://platform_app:${PLATFORM_APP_PASSWORD}@postgres:5432/platform_db
      PLATFORM_FILES_BUCKET: docbeam-local-platform-files
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: http://localstack:4566
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/platform_db
      JWT_ISSUER: ${JWT_ISSUER}
      JWKS_URL: http://auth:3001/.well-known/jwks.json
    ports: ["3002:3002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  docbeam-api:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: docbeam-api }
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
      auth: { condition: service_healthy }
      platform: { condition: service_healthy }
    # exec: node becomes PID 1 and gets SIGTERM, so a stop drains in-flight requests (D-M2-17).
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/server.js"]
    environment:
      PORT: 3003
      DATABASE_URL: postgres://docbeam_app:${DOCBEAM_APP_PASSWORD}@postgres:5432/docbeam_db
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/docbeam_db
      JWT_ISSUER: ${JWT_ISSUER}
      JWKS_URL: http://auth:3001/.well-known/jwks.json
      <<: *aws-env
      OBJECT_STORE_BUCKET: docbeam-local-object-store
      # Links go to the browser, which reaches LocalStack on the host (D-M2-11).
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      JOB_QUEUE_URL: http://localstack:4566/000000000000/docbeam-local-job
      AUTH_URL: http://auth:3001
      PLATFORM_URL: http://platform:3002
      CLIENT_SECRET_DOCBEAM_API: ${CLIENT_SECRET_DOCBEAM_API}
      # Cancel and retry push a job_update here. No depends_on: ws-local itself waits for this service.
      WS_MANAGEMENT_ENDPOINT: http://ws-local:3004
    ports: ["3003:3003"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: loads the demo and 50-team seed files after auth and platform are healthy (Step 1.2).
  # Run it after `up`: docker compose run --rm seed. Safe to re-run. It has a profile because
  # `up --wait` treats a container that exits as a failure.
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: platform }
    command: ["node", "dist/seed-run.js"]
    restart: "no"
    depends_on:
      auth: { condition: service_healthy }
      platform: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://platform_app:${PLATFORM_APP_PASSWORD}@postgres:5432/platform_db
      AUTH_URL: http://auth:3001
      CLIENT_SECRET_SEED_SCRIPT: ${CLIENT_SECRET_SEED_SCRIPT}
      SEED_CREATE_USERS: "true"
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}

  workers:
    build:
      context: .
      dockerfile: docker/workers.Dockerfile
    image: docbeam-workers
    restart: unless-stopped
    environment:
      <<: *aws-env
      QUEUE_PREFIX: docbeam-local
      # The Lambdas connect as the DocBeam app role, one connection each (D-M0-6).
      DATABASE_URL: postgres://docbeam_app:${DOCBEAM_APP_PASSWORD}@postgres:5432/docbeam_db
      # The Upload Events handler scans through the clamav container (ADR-016).
      CLAMD_HOST: clamav
      # Fan-out sends one message per task here (ADR-008).
      TASK_QUEUE_URL: http://localstack:4566/000000000000/docbeam-local-task
      # The sweeper sends the job message again for a job that did not start.
      JOB_QUEUE_URL: http://localstack:4566/000000000000/docbeam-local-job
      # Delivery streams the staged file to the platform as the delivery-worker client (ADR-013).
      AUTH_URL: http://auth:3001
      PLATFORM_URL: http://platform:3002
      CLIENT_SECRET_DELIVERY_WORKER: ${CLIENT_SECRET_DELIVERY_WORKER}
      OBJECT_STORE_BUCKET: docbeam-local-object-store
      # Pushes go to the local stand-in for the API Gateway management API.
      WS_MANAGEMENT_ENDPOINT: http://ws-local:3004
      # LocalStack stores no checksum for a presigned POST (D-M2-15). Never set on AWS.
      S3_CHECKSUM_OPTIONAL: "true"
    depends_on:
      localstack: { condition: service_healthy }
      postgres: { condition: service_healthy }
      clamav: { condition: service_healthy }
      auth: { condition: service_healthy }
      platform: { condition: service_healthy }
      # The DocBeam API runs the migrations that create the tables the workers use.
      docbeam-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  ws-local:
    image: docbeam-workers
    pull_policy: never
    restart: unless-stopped
    command: ["node", "dist/ws-local-main.js"]
    environment:
      WS_LOCAL_PORT: 3004
      # The WS Handlers run inside this container (ADR-007). They connect as the DocBeam app role, check the
      # browser's token against the Auth Service, and read a viewer's teams from the platform as `ws-handlers`.
      DATABASE_URL: postgres://docbeam_app:${DOCBEAM_APP_PASSWORD}@postgres:5432/docbeam_db
      JWT_ISSUER: ${JWT_ISSUER}
      JWKS_URL: http://auth:3001/.well-known/jwks.json
      AUTH_URL: http://auth:3001
      PLATFORM_URL: http://platform:3002
      CLIENT_SECRET_WS_HANDLERS: ${CLIENT_SECRET_WS_HANDLERS}
      # The handlers answer a subscribe through this container's own management endpoint.
      WS_MANAGEMENT_ENDPOINT: http://localhost:3004
    ports: ["3004:3004"]
    depends_on:
      workers: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:

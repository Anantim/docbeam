name: platform

on:
  pull_request:
    paths: &paths
      - services/platform/**
      - packages/shared/**
      - docker/service.Dockerfile
      - package.json
      - package-lock.json
      - tsconfig*.json
      - .github/workflows/platform.yml
      - .github/workflows/_service.yml
      - scripts/push-image.sh
      - scripts/deploy-service.sh
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-prod to deploy to prod (runs from main only)
        required: false
        default: ''
      force:
        description: Deploy even when the service already runs this image
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      service: platform
      confirm: ${{ inputs.confirm || '' }}
      force: ${{ inputs.force || false }}
    secrets: inherit
